name: Test and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - name: Dunkles Design aktuell
        run: python tools/gen_dark_theme.py && git diff --exit-code static/dark.css

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Bootloader aus dem Quellcode übersetzen statt die vorgefertigte runw.exe zu verwenden:
      # die Standard-Bootloader werden von Virenscannern (ML-Erkennung, z. B. Wacatac!ml) oft fälschlich gemeldet.
      - name: PyInstaller mit eigenem Bootloader
        shell: pwsh
        run: |
          git clone --quiet --depth 1 --branch v6.22.3 https://github.com/pyinstaller/pyinstaller.git "$env:RUNNER_TEMP\pyinstaller"
          Push-Location "$env:RUNNER_TEMP\pyinstaller\bootloader"
          python ./waf all --target-arch=64bit
          if ($LASTEXITCODE -ne 0) { throw "Bootloader konnte nicht übersetzt werden." }
          Pop-Location
          pip install "$env:RUNNER_TEMP\pyinstaller"
      - name: Bootloader prüfen
        shell: pwsh
        run: |
          $loader = python -c "import PyInstaller, os; print(os.path.join(os.path.dirname(PyInstaller.__file__), 'bootloader', 'Windows-64bit-intel', 'runw.exe'))"
          Get-FileHash $loader -Algorithm SHA256 | Format-List
      - run: pyinstaller --noconfirm cko-modbus-inspector.spec
      - name: Smoke test
        shell: pwsh
        run: |
          $env:HBMODBUS_PORT = "48799"
          $env:HBMODBUS_DATA_DIR = "$env:RUNNER_TEMP\modbus-data"
          $process = Start-Process -FilePath "dist/CKO-Modbus-Inspector/CKO-Modbus-Inspector.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 1
            try { $ok = (Invoke-RestMethod "http://127.0.0.1:48799/api/health").ok } catch {}
          }
          $page = Invoke-WebRequest "http://127.0.0.1:48799/" -UseBasicParsing
          $catalog = Invoke-RestMethod "http://127.0.0.1:48799/api/device-catalog"
          $ports = Invoke-RestMethod "http://127.0.0.1:48799/api/serial-ports"
          Stop-Process -Id $process.Id -Force
          if (-not $ok -or $page.StatusCode -ne 200) { throw "Die gebaute Anwendung startet nicht." }
          if ($catalog.counts.total -lt 95) { throw "Mitgelieferte Geräteeinträge fehlen: $($catalog.counts.total)" }
          $models = Get-ChildItem -Path "dist/CKO-Modbus-Inspector" -Recurse -Filter "sunspec_models.json" | Select-Object -First 1
          if (-not $models) { throw "SunSpec-Modelle fehlen in der gebauten Anwendung." }
          $help = Get-ChildItem -Path "dist/CKO-Modbus-Inspector" -Recurse -Filter "help-1-start.webp" | Select-Object -First 1
          if (-not $help) { throw "Bilder der Kurzanleitung fehlen in der gebauten Anwendung." }
          $rtu = Get-ChildItem -Path "dist/CKO-Modbus-Inspector" -Recurse -Filter "rtu-wiring.svg" | Select-Object -First 1
          if (-not $rtu) { throw "Grafiken der RTU-Anleitung fehlen in der gebauten Anwendung." }
          if (-not $ports.available) { throw "pyserial fehlt in der gebauten Anwendung (RTU über USB)." }
          Write-Host "Nachschlagewerk: $($catalog.counts.total) Einträge"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\cko-modbus-inspector.iss"
      - uses: actions/upload-artifact@v4
        with:
          name: cko-modbus-inspector-windows-installer
          path: dist-installer/CKO-Modbus-Inspector-Setup.exe
