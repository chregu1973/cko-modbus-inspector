<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="Segoe UI, Inter, Arial, sans-serif">
  <title>Verdrahtung USB-RS485-Adapter mit Modbus-Zähler</title>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="700" fill="#101b3d">RS485-Zähler am Laptop anschliessen</text>
  <text x="40" y="84" font-size="16" fill="#5b6b82">A an A · B an B · GND an GND · 120 Ω am Leitungsende</text>

  <!-- Laptop -->
  <g transform="translate(40,170)">
    <rect x="10" y="0" width="180" height="120" rx="10" fill="#eaf1fa" stroke="#101b3d" stroke-width="3"/>
    <rect x="24" y="14" width="152" height="92" rx="4" fill="#ffffff" stroke="#a9ccef" stroke-width="2"/>
    <text x="100" y="56" font-size="14" font-weight="700" fill="#0a84c6" text-anchor="middle">Modbus</text>
    <text x="100" y="76" font-size="14" font-weight="700" fill="#0a84c6" text-anchor="middle">Inspector</text>
    <path d="M0 128 h200 l-14 18 h-172 z" fill="#c9d6e6" stroke="#101b3d" stroke-width="3" stroke-linejoin="round"/>
    <text x="100" y="180" font-size="15" fill="#5b6b82" text-anchor="middle">Laptop</text>
  </g>
  <!-- USB-Kabel -->
  <path d="M240 250 C 285 250, 290 300, 330 300" fill="none" stroke="#101b3d" stroke-width="5" stroke-linecap="round"/>

  <!-- Adapter -->
  <g transform="translate(330,240)">
    <rect x="0" y="0" width="200" height="120" rx="14" fill="#101b3d"/>
    <text x="100" y="34" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">USB-RS485</text>
    <text x="100" y="56" font-size="13" fill="#a9ccef" text-anchor="middle">Adapter (COM-Port)</text>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="24" y="72" width="44" height="34" rx="5" fill="#0a84c6"/><text x="46" y="95" fill="#fff">A</text>
      <rect x="78" y="72" width="44" height="34" rx="5" fill="#e08a00"/><text x="100" y="95" fill="#fff">B</text>
      <rect x="132" y="72" width="44" height="34" rx="5" fill="#6b7a90"/><text x="154" y="95" fill="#fff">GND</text>
    </g>
    <text x="100" y="-12" font-size="13" fill="#5b6b82" text-anchor="middle">Klemmen auch D+ / D− oder Data+ / Data−</text>
  </g>

  <!-- Leitungen -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M376 346 V 440 H 870 V 346" stroke="#0a84c6"/>
    <path d="M430 346 V 410 H 816 V 346" stroke="#e08a00"/>
    <path d="M484 346 V 380 H 762 V 346" stroke="#6b7a90" stroke-dasharray="10 8"/>
  </g>
  <g font-size="15" font-weight="700">
    <text x="600" y="468" fill="#0a84c6" text-anchor="middle">A ↔ A</text>
    <text x="600" y="402" fill="#e08a00" text-anchor="middle">B ↔ B</text>
    <text x="623" y="368" fill="#6b7a90" text-anchor="middle">GND ↔ GND (falls vorhanden)</text>
  </g>
  <text x="600" y="500" font-size="14" fill="#5b6b82" text-anchor="middle">verdrillte Zweidrahtleitung, z. B. J-Y(St)Y 2×2×0,8</text>

  <!-- Zähler -->
  <g transform="translate(740,130)">
    <rect x="0" y="0" width="190" height="230" rx="12" fill="#f4f8fd" stroke="#101b3d" stroke-width="3"/>
    <rect x="22" y="22" width="146" height="54" rx="6" fill="#dff3e8" stroke="#16894a" stroke-width="2"/>
    <text x="95" y="57" font-size="22" font-weight="700" fill="#16683e" text-anchor="middle" font-family="Consolas, monospace">1234.5 kWh</text>
    <text x="95" y="108" font-size="16" font-weight="700" fill="#101b3d" text-anchor="middle">Energiezähler</text>
    <text x="95" y="130" font-size="13" fill="#5b6b82" text-anchor="middle">Modbus RTU</text>
    <g font-size="15" font-weight="700" text-anchor="middle">
      <rect x="20" y="182" width="44" height="34" rx="5" fill="#6b7a90"/><text x="42" y="205" fill="#fff">GND</text>
      <rect x="74" y="182" width="44" height="34" rx="5" fill="#e08a00"/><text x="96" y="205" fill="#fff">B</text>
      <rect x="128" y="182" width="44" height="34" rx="5" fill="#0a84c6"/><text x="150" y="205" fill="#fff">A</text>
    </g>
  </g>

  <!-- Abschlusswiderstand zwischen A und B am Zähler (Leitungsende) -->
  <g>
    <path d="M816 384 H 828 M858 384 H 870" stroke="#101b3d" stroke-width="3"/>
    <rect x="828" y="376" width="30" height="16" rx="2" fill="#ffffff" stroke="#101b3d" stroke-width="3"/>
    <path d="M872 384 C 920 384, 930 410, 960 410" fill="none" stroke="#101b3d" stroke-width="1.5"/>
    <text x="966" y="406" font-size="18" font-weight="700" fill="#101b3d">120 Ω</text>
    <text x="966" y="426" font-size="13" fill="#5b6b82">zwischen A und B</text>
    <text x="966" y="444" font-size="13" fill="#5b6b82">am Leitungsende</text>
  </g>

  <!-- Hinweis -->
  <rect x="40" y="530" width="1120" height="48" rx="10" fill="#fff8e9" stroke="#f1dbac"/>
  <text x="60" y="561" font-size="16" fill="#9a6500"><tspan font-weight="700">Keine Antwort?</tspan> A und B einfach tauschen – das beschädigt nichts. Nur ein Master am Bus: Gateway oder SPS für die Prüfung abklemmen.</text>
</svg>
